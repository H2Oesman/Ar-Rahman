        .play-btn { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; background: var(--link-color); color: var(--container-bg); box-shadow: 0 4px 14px rgba(30, 95, 142, 0.28); transition: transform 0.2s ease, box-shadow 0.2s ease; text-decoration: none; padding: 0; }
